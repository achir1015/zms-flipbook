name: ZMSFlipbook
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10000"
targets:
  ZMSFlipbook:
    type: application
    platform: iOS
    sources:
      - path: ZMSFlipbook
      - path: web            # 和線上版同一份網頁（sync.sh 從 ../docs 複製進來），整個資料夾放進 App → 離線也能用
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.zmsflipbook
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZMSFlipbook/Info.plist
      properties:
        CFBundleDisplayName: 資料助秘電子書翻頁
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: 從照片選取要做成電子書頁面的相片
        NSCameraUsageDescription: 拍照加入電子書頁面
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  ZMSFlipbook:
    build:
      targets:
        ZMSFlipbook: all
    run:
      config: Debug
    archive:
      config: Release
